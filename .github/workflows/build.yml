name: Build APK

on:
  push:
    branches: [ main, 'ui-*', 'dev-*' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.2.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests
        run: ./gradlew :engine:test --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk river-runner-${VERSION_NAME}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: river-runner-apk
          path: river-runner-*.apk

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest river-runner-*.apk --prerelease \
            --title "Latest build (${VERSION_NAME})" \
            --notes "Automatic build of ${GITHUB_SHA::7}. 下载 APK 直接安装即可（可覆盖旧版本）。"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" river-runner-*.apk --title "${GITHUB_REF_NAME}" --generate-notes

  screenshots:
    # Renders the UI on the JVM (Robolectric + Roborazzi) and publishes the PNGs to the
    # "screenshots" branch, so layout changes can be reviewed without a device.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: ./gradlew :app:recordRoborazziDebug --no-daemon --stacktrace

      - name: Publish to screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/shots
          cp app/build/screenshots/*.png /tmp/shots/ 2>/dev/null || true
          if [ -d app/build/reports/tests/testDebugUnitTest ]; then cp -r app/build/reports/tests/testDebugUnitTest /tmp/shots/test-report; fi
          cd /tmp/shots
          echo "${GITHUB_SHA}" > COMMIT
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
